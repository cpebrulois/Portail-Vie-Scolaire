<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Fil de Valdurne — la quête guidée</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--or:#c9a84c;--or2:#e8c97a;--enc:#e8dfc8;--enc2:#c8bfa8;--p0:#0b0906;--nuit:#1a2340;--vert:#5da35d}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--p0);color:var(--enc);font-family:'Crimson Text',Georgia,serif;font-size:1.14em;line-height:1.85;min-height:100vh}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:9px 18px;background:rgba(11,9,6,.95);border-bottom:1px solid rgba(201,168,76,.16);backdrop-filter:blur(6px);flex-wrap:wrap}
.top .t{font-family:'Cinzel',serif;font-size:.6em;letter-spacing:3px;color:var(--or);text-transform:uppercase}
.top .prog{flex:1;min-width:90px;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.top .fill{height:100%;background:linear-gradient(90deg,var(--or),var(--or2));width:0;transition:width .6s}
.top a,.top select{font-family:'Cinzel',serif;font-size:.6em;letter-spacing:1px;color:var(--enc2);text-decoration:none;border:1px solid rgba(201,168,76,.2);padding:4px 9px;border-radius:4px;background:transparent}
.top a:hover{color:var(--or);border-color:var(--or)}
.top select option{background:#161109;color:var(--enc)}
.scene{max-width:720px;margin:0 auto;padding:0 22px 90px}
.illus{margin:0 -22px 26px;height:210px;background:linear-gradient(160deg,var(--nuit),#0d0b08 70%);border-bottom:1px solid rgba(201,168,76,.22);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.illus img{width:100%;height:100%;object-fit:cover}
.illus .rune{font-size:2.3em;color:var(--or);opacity:.22;font-family:'Cinzel Decorative',serif}
.illus::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(11,9,6,.95))}
.chap{font-family:'Cinzel',serif;font-size:.6em;letter-spacing:4px;color:var(--or);text-transform:uppercase;opacity:.75;margin-bottom:4px}
h1{font-family:'Cinzel Decorative',serif;font-size:1.5em;color:var(--or2);line-height:1.2;margin-bottom:24px}
.b{margin-bottom:1.15em;animation:ap .5s ease}
@keyframes ap{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.narr{text-align:justify}
.kern{color:var(--or2);padding-left:18px;border-left:2px solid rgba(201,168,76,.45)}
.kern::before{content:'Kern — ';font-family:'Cinzel',serif;font-size:.62em;letter-spacing:2px;color:var(--or);opacity:.75;text-transform:uppercase}
.suite{display:block;margin:22px auto 0;padding:9px 26px;background:transparent;border:1px solid rgba(201,168,76,.35);border-radius:5px;color:var(--or2);font-family:'Cinzel',serif;font-size:.72em;letter-spacing:2px;cursor:pointer}
.suite:hover{background:rgba(201,168,76,.12);border-color:var(--or)}
.ask{font-family:'Cinzel',serif;font-size:.66em;letter-spacing:2px;color:var(--or);text-transform:uppercase;opacity:.8;margin:26px 0 10px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);border-radius:6px;color:var(--enc);padding:14px 18px;margin:8px 0;cursor:pointer;font-family:'Crimson Text',Georgia,serif;font-size:.97em;line-height:1.55;transition:all .2s}
.opt:hover{background:rgba(201,168,76,.09);border-color:rgba(201,168,76,.55);transform:translateX(4px)}
.opt.off{opacity:.35;pointer-events:none}
.act{background:linear-gradient(135deg,rgba(201,168,76,.1),rgba(26,35,64,.25));border:1px solid var(--or);border-radius:9px;padding:20px 22px;margin:22px 0;text-align:center}
.act .n{font-family:'Cinzel',serif;font-size:.62em;letter-spacing:3px;color:var(--or);text-transform:uppercase;margin-bottom:6px}
.act .ti{font-family:'Cinzel Decorative',serif;color:var(--or2);font-size:1.06em;margin-bottom:14px}
.act button{margin:5px 4px;padding:10px 20px;border-radius:5px;font-family:'Cinzel',serif;font-size:.74em;letter-spacing:1px;cursor:pointer;border:1px solid var(--or);background:rgba(201,168,76,.16);color:var(--or2)}
.act button.ghost{background:transparent;border-color:rgba(201,168,76,.25);color:var(--enc2)}
.note{font-size:.82em;color:var(--enc2);opacity:.7;font-style:italic;margin-top:10px}
.fin{text-align:center;padding:30px 0}
.fin .sceau{font-size:2.8em;margin-bottom:10px}
.fin .r{font-family:'Cinzel Decorative',serif;font-size:1.25em;color:var(--or2);margin-bottom:8px}
.fin .kmot{max-width:520px;margin:18px auto 0;padding-top:16px;border-top:1px solid rgba(201,168,76,.2);color:var(--or2);font-style:italic;line-height:1.7;text-align:left}
.fin .kmot.attente{color:var(--enc2);opacity:.5;font-size:.9em;text-align:center;animation:respire 1.8s ease-in-out infinite}
@keyframes respire{0%,100%{opacity:.28}50%{opacity:.6}}
.fin .xp{display:inline-flex;gap:6px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);padding:5px 14px;border-radius:20px;font-family:'Cinzel',serif;font-size:.7em;color:#ffd700;margin-top:12px}
.lock{max-width:560px;margin:70px auto;padding:0 22px;text-align:center}
a.bk{color:var(--enc2);font-size:.76em;text-decoration:none;border:1px solid rgba(201,168,76,.24);padding:8px 16px;border-radius:4px;font-family:'Cinzel',serif;letter-spacing:1px;display:inline-block;margin:5px}
a.bk:hover{color:var(--or);border-color:var(--or)}
@media(max-width:600px){body{font-size:1.05em}.illus{height:160px}.scene{padding:0 16px 70px}}
</style>
</head>
<body>

<div class="top" id="top" style="display:none">
  <span class="t">⚜️ Le Fil de Valdurne</span>
  <span class="prog"><span class="fill" id="fill"></span></span>
  <select id="selChap" onchange="allerA(this.value)"></select>
  <a href="index.html">Quitter</a>
</div>

<div id="lock" class="lock" style="display:none"></div>

<div class="scene" id="scene" style="display:none">
  <div class="illus" id="illus"><span class="rune">✦</span></div>
  <div class="chap" id="chap"></div>
  <h1 id="titre"></h1>
  <div id="flux"></div>
</div>

<script type="module">
/* Le fil chargé dépend du RANG du joueur. Un écuyer ne doit jamais recevoir
   les chapitres de page : ses validations seraient inscrites sous le mauvais
   niveau et ne compteraient pas dans son score. */
const FILS = ['./filage_page.js','./filage_ecuyer.js',
              './filage_chevalier.js','./filage_veilleur.js'];
const GRADES = ['Page','Écuyer','Chevalier','Veilleur'];

var AKEY='pvs_current_player', KEY='pvs_hof_v2';
var FILAGE_XP=600, TOTAL=8;
var cur='', ch=null, idx=0, nom='Page';
var NIVEAU=0, CHAPITRES=[];
var choix=[];               // ce que l'élève a répondu dans le chapitre en cours

function getS(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function saveS(S){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function getP(c){var S=getS();return(S.players&&S.players[c])?S.players[c]:null}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sub(s){return String(s).replace(/\{nom\}/g,esc(nom))}
function $(i){return document.getElementById(i)}

/* ---- progression du filage, stockée dans le joueur ---- */
function faits(){
  var p=getP(cur), d=(p&&p.filageDone)||{}, out={};
  for(var c=1;c<=TOTAL;c++) if(d[NIVEAU+'_'+c]) out[c]=d[NIVEAU+'_'+c];
  return out;
}
function marquer(c){
  var S=getS(); if(!S.players||!S.players[cur])return;
  var p=S.players[cur];
  if(!p.filageDone||typeof p.filageDone!=='object')p.filageDone={};
  var cle=NIVEAU+'_'+c;
  if(p.filageDone[cle])return false;            // deja valide : pas de double credit
  p.filageDone[cle]=new Date().toISOString();
  p.up=new Date().toISOString();
  if(!Array.isArray(S.logs))S.logs=[];
  S.logs.unshift({d:p.up,p:cur,t:'FILAGE_CHAPITRE_'+cle,target:'FILAGE',xp:FILAGE_XP});
  if(S.logs.length>700)S.logs.length=700;
  p.wBonusG=(Number(p.wBonusG||0)+FILAGE_XP/10);
  p.wBonusW=(Number(p.wBonusW||0)+FILAGE_XP/10);
  saveS(S);
  try{
    var ev=JSON.parse(localStorage.getItem('pvs_bridge_events')||'[]');
    ev.push({id:'FIL-'+cur+'-'+cle+'-'+Date.now(),type:'FILAGE_CHAPITRE',player:cur,
             module:'FILAGE_'+cle,xp:FILAGE_XP,d:p.up});
    if(ev.length>700)ev=ev.slice(-700);
    localStorage.setItem('pvs_bridge_events',JSON.stringify(ev));
  }catch(e){}
  return true;
}
function moduleFait(mod){
  if(!mod)return true;
  try{
    var p=getP(cur);
    if(p&&p.pixhareDone&&p.pixhareDone[mod])return true;
    var ev=JSON.parse(localStorage.getItem('pvs_bridge_events')||'[]');
    return ev.some(function(e){return e&&String(e.module||'').toUpperCase().indexOf(mod)>=0
      &&(!e.player||String(e.player).toUpperCase()===cur)});
  }catch(e){return false}
}

/* ---- rendu ---- */
var pos=0, flux;
function ouvrir(i){
  idx=i; ch=CHAPITRES[i]; pos=0; choix=[];
  $('chap').textContent='Chapitre '+ch.n+' sur '+TOTAL;
  $('titre').textContent=ch.titre;
  var il=$('illus'); il.innerHTML='<span class="rune">✦</span>';
  var im=new Image();
  im.onload=function(){il.innerHTML='';il.appendChild(im)};
  im.onerror=function(){};
  im.src=ch.img; im.alt='';
  $('fill').style.width=Math.round((ch.n-1)/TOTAL*100)+'%';
  flux=$('flux'); flux.innerHTML='';
  majSelect();
  window.scrollTo({top:0,behavior:'smooth'});
  suivant();
}
function ajoute(html,cls){var d=document.createElement('div');d.className='b '+(cls||'');d.innerHTML=html;flux.appendChild(d);return d}
function bouton(txt,fn){
  var b=document.createElement('button'); b.className='suite'; b.textContent=txt;
  b.onclick=function(){b.remove();fn()};
  flux.appendChild(b); b.scrollIntoView({block:'center',behavior:'smooth'});
}

function suivant(){
  if(pos>=ch.b.length)return;
  var b=ch.b[pos++];
  if(b.t==='n'){ajoute(sub(esc(b.x)),'narr');return void bouton('Continuer',suivant)}
  if(b.t==='k'){ajoute(sub(esc(b.x)),'kern');return void bouton('Continuer',suivant)}
  if(b.t==='q'){
    ajoute('<div class="ask">'+esc(b.q)+'</div>');
    var box=document.createElement('div'); flux.appendChild(box);
    b.o.forEach(function(o){
      var bt=document.createElement('button');
      bt.className='opt'; bt.textContent=o.x;
      bt.onclick=function(){
        if(box.dataset.rep)return;        // une seule reponse par question
        box.dataset.rep='1';
        box.style.pointerEvents='none';   // l'option retenue reste lisible, plus cliquable
        Array.prototype.forEach.call(box.children,function(c){c.classList.add('off')});
        bt.classList.remove('off');
        choix.push({q:b.q,x:o.x});
        ajoute(sub(esc(o.r)),'kern');
        bouton('Continuer',suivant);
      };
      box.appendChild(bt);
    });
    return;
  }
  if(b.t==='act'){
    var d=document.createElement('div'); d.className='act';
    d.innerHTML='<div class="n">'+esc(b.n)+'</div><div class="ti">'+esc(b.ti)+'</div>';
    var o=document.createElement('button'); o.textContent='Ouvrir ↗';
    var f=document.createElement('button'); f.textContent="J'ai terminé";
    var s=document.createElement('button'); s.className='ghost'; s.textContent='Plus tard';
    var m=document.createElement('div'); m.className='note';
    o.onclick=function(){window.open(b.href,'_blank','noopener')};
    f.onclick=function(){
      if(moduleFait(b.mod)){d.remove();suivant()}
      else m.textContent="Je ne vois pas encore ta réponse arriver. Termine le module jusqu’au bout, puis reviens — ou passe, on y reviendra.";
    };
    s.onclick=function(){d.remove();suivant()};
    d.appendChild(o);d.appendChild(f);d.appendChild(s);d.appendChild(m);
    flux.appendChild(d); d.scrollIntoView({block:'center',behavior:'smooth'});
    return;
  }
  if(b.t==='fin'){
    var neuf=marquer(ch.n);
    $('fill').style.width=Math.round(ch.n/TOTAL*100)+'%';
    var f2=document.createElement('div'); f2.className='fin';
    var suite=CHAPITRES[idx+1];
    f2.innerHTML='<div class="sceau">'+(b.sceau?'⚜️':'✦')+'</div>'+
      '<div class="r">Chapitre '+ch.n+' — accompli</div>'+
      '<div style="color:var(--enc2);font-style:italic;opacity:.85;max-width:520px;margin:0 auto">'+esc(b.mot)+'</div>'+
      '<div class="kmot" id="kmot"></div>'+
      (neuf?'<div class="xp">⚡ +'+FILAGE_XP+' XP — et une part de tes points revélée</div>':
            '<div class="note">Chapitre déjà validé : aucun point supplémentaire.</div>')+
      '<div style="margin-top:20px">'+
        (suite?'<a class="bk" href="#" id="btnSuite">Chapitre '+suite.n+' : '+esc(suite.titre)+' →</a>':
               '<a class="bk" href="hub_narration.html">La Bibliothèque</a>')+
        '<a class="bk" href="index.html">Le Portail</a></div>';
    flux.appendChild(f2);
    var bs=$('btnSuite');
    if(bs)bs.onclick=function(e){e.preventDefault();ouvrir(idx+1)};
    f2.scrollIntoView({block:'center',behavior:'smooth'});
    majSelect();
    motDeKern(b);            // ornement : le chapitre est deja valide au-dessus
    return;
  }
  suivant();
}

/* ---------------------------------------------------------------------------
 * Le mot de Kern : la seule chose vivante du filage.
 *
 * Tout le reste est ecrit d'avance. Ici, Kern rebondit sur les reponses que
 * l'eleve vient de donner. Le chapitre est deja valide et les XP deja credites
 * quand cette fonction demarre : si le reseau tombe, si l'API refuse, si la
 * reponse est illisible, la case disparait sans bruit et la phrase de cloture
 * ecrite d'avance reste seule. Rien ne depend de Mistral.
 *
 * La reponse est mise en cache sur la signature des choix : relire un chapitre
 * sans rien changer ne rappelle pas l'API.
 * ------------------------------------------------------------------------- */
function signature(){
  return NIVEAU+'_'+ch.n+'_'+choix.map(function(c){return String(c.x).slice(0,24)}).join('|');
}
function motDeKern(b){
  var box=$('kmot'); if(!box||!choix.length)return;
  var cle='pvs_kern_fil', sig=signature(), cache={};
  try{cache=JSON.parse(localStorage.getItem(cle)||'{}')}catch(e){}
  if(cache[sig]){ box.className='kmot'; box.textContent=cache[sig]; return; }

  box.className='kmot attente';
  box.textContent='Kern cherche ses mots…';

  var stop=new AbortController(), fini=false;
  var minuteur=setTimeout(function(){stop.abort()},9000);
  function renonce(){ if(fini)return; fini=true; clearTimeout(minuteur); box.remove(); }

  fetch('/api/filage',{
    method:'POST', signal:stop.signal,
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({niveau:NIVEAU,titre:ch.titre,cible:ch.cible||'',mot:b.mot||'',choix:choix})
  })
  .then(function(r){ return r.ok?r.json():null })
  .then(function(j){
    if(fini)return;
    if(!j||!j.mot){ return renonce() }
    fini=true; clearTimeout(minuteur);
    box.className='kmot'; box.textContent=j.mot;
    try{ cache[sig]=j.mot;
         var k=Object.keys(cache); if(k.length>40) delete cache[k[0]];
         localStorage.setItem(cle,JSON.stringify(cache)); }catch(e){}
  })
  .catch(renonce);
}

function majSelect(){
  var s=$('selChap'); if(!s)return;
  var f=faits();
  s.innerHTML=CHAPITRES.map(function(c,i){
    var ok=!!f[c.n], dispo=ok||c.n===prochain();
    return '<option value="'+i+'"'+(i===idx?' selected':'')+(dispo?'':' disabled')+'>'+
           (ok?'✓ ':'')+'Ch. '+c.n+' — '+c.titre+'</option>';
  }).join('');
}
function prochain(){
  var f=faits(), debut=(NIVEAU===0)?2:1;   // au niveau Page, le 1 est le Seuil
  for(var c=debut;c<=TOTAL;c++) if(!f[c]) return c;
  return TOTAL;
}
window.allerA=function(i){ ouvrir(Number(i)); };

/* ---- une fois le fil du bon niveau chargé ---- */
function demarrer(p){
  // Au niveau Page, le chapitre 1 EST le Seuil : sans lui, on n'entre pas dans
  // le fil. Aux niveaux superieurs, le chapitre 1 fait partie du fil lui-meme.
  var f=faits();
  if(NIVEAU===0 && !f[1]){
    $('lock').style.display='block';
    $('lock').innerHTML='<div style="font-family:Cinzel Decorative,serif;font-size:1.4em;color:#e8c97a;margin-bottom:12px">Commence par le Seuil</div>'+
      '<p style="color:#c8bfa8;font-style:italic">Le premier chapitre du fil, c’est ta rencontre avec Kern.<br>'+
      'Il t’attend à la porte.</p>'+
      '<div style="margin-top:18px"><a class="bk" href="seuil.html">Le Seuil de Valdurne →</a>'+
      '<a class="bk" href="index.html">Le Portail</a></div>';
    return;
  }
  $('top').style.display='flex'; $('scene').style.display='block';
  var n=prochain();
  var i=0; for(var k=0;k<CHAPITRES.length;k++) if(CHAPITRES[k].n===n){i=k;break}
  ouvrir(i);
}

/* Démarrage : on lit le rang, puis on charge le fil correspondant. */
(async function(){
  cur=(localStorage.getItem(AKEY)||'').trim().toUpperCase();
  var p=cur?getP(cur):null;
  nom=(localStorage.getItem('pvs_nom_page')||'').trim()||'Page';
  if(!cur||!p){
    $('lock').style.display='block';
    $('lock').innerHTML='<div style="font-family:Cinzel Decorative,serif;font-size:1.4em;color:#e8c97a;margin-bottom:12px">Le Fil de Valdurne</div>'+
      '<p style="color:#c8bfa8;font-style:italic">Connecte-toi au Portail avec ton nom de page pour reprendre la quête.</p>'+
      '<div style="margin-top:18px"><a class="bk" href="index.html">← Le Portail</a></div>';
    return;
  }
  NIVEAU=(p.rankData&&typeof p.rankData.i==='number')?p.rankData.i:0;
  var mod=null;
  try{ mod=await import(FILS[NIVEAU]||FILS[0]); }catch(e){ mod=null; }
  if(!mod||!Array.isArray(mod.CHAPITRES)||!mod.CHAPITRES.length){
    // Le fil de ce niveau n'est pas encore écrit : on le dit franchement.
    $('lock').style.display='block';
    $('lock').innerHTML='<div style="font-family:Cinzel Decorative,serif;font-size:1.4em;color:#e8c97a;margin-bottom:12px">Le fil du rang '+
      (GRADES[NIVEAU]||'')+' s’écrit encore</div>'+
      '<p style="color:#c8bfa8;font-style:italic">Kern prépare tes chapitres. En attendant, rien ne t’empêche '+
      'd’avancer&nbsp;: les modules restent tous ouverts, et chacun compte.</p>'+
      '<div style="margin-top:18px"><a class="bk" href="index.html">Explorer le Portail</a>'+
      '<a class="bk" href="hub_narration.html">La Bibliothèque</a></div>';
    return;
  }
  NIVEAU=(typeof mod.NIVEAU==='number')?mod.NIVEAU:NIVEAU;
  CHAPITRES=mod.CHAPITRES;
  demarrer(p);
})();
</script>
</body>
</html>
